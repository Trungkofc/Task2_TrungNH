<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Management System</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<main class="login-page">
    <div class="login-shell">

        <a href="index.html" class="logo-square">M</a>

        <h1>Welcome Back!</h1>
        <p class="login-subtitle">Sign in to continue to your account.</p>

        <section class="login-card">
            <h2>Login to your account</h2>
            <p class="hint">Enter your email and password to get started.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input class="form-control" id="email" type="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="#" class="small-link">Forgot password?</a>
                    </div>

                    <div class="password-wrap">
                        <input class="form-control" id="password" type="password" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" id="togglePassword">Show</button>
                    </div>
                </div>

                <label class="remember-row">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>

                <button class="btn-primary login-btn" type="submit">Sign In</button>
                <p class="error-message" id="errorMessage"></p>

                <p class="account-row">
                    Don't have an account?
                    <a href="#" id="createAccount">Create an account</a>
                </p>
            </form>
        </section>

        <p class="login-footer">© 2026 My Website. All rights reserved.</p>
    </div>
</main>

<div class="modal-backdrop" id="signupModalBackdrop">
    <section class="course-modal auth-modal">

        <header class="modal-header">
            <h3>Create an Account</h3>
            <button class="modal-close-x" id="signupCloseX" type="button">×</button>
        </header>

        <form id="signupForm">
            <div class="modal-body auth-modal-body">

                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input class="form-control" id="signupName" type="text" placeholder="Your name">
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input class="form-control" id="signupEmail" type="email" placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input class="form-control" id="signupPassword" type="password" placeholder="At least 6 characters">
                </div>

                <div class="form-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <input class="form-control" id="signupConfirmPassword" type="password" placeholder="Enter password again">
                </div>

                <p class="form-message" id="signupMessage"></p>
            </div>

            <footer class="modal-footer auth-modal-footer">
                <button class="btn-secondary" id="signupCancelButton" type="button">Cancel</button>
                <button class="btn-primary auth-submit" type="submit">Create Account</button>
            </footer>
        </form>

    </section>
</div>

<script src="assets/js/login.js"></script>
</body>
</html>
